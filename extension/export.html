<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResumeFit – export</title>
  <style>
    :root { --ink: #111; --muted: #555; --line: #ddd; --accent: #4f46e5; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e9e9ee;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
    }
    .bar {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .bar strong { font-weight: 600; }
    .bar span { color: var(--muted); }
    .bar button {
      font: inherit; font-weight: 600; color: #fff; background: var(--accent);
      border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer;
    }
    .sheet {
      width: 210mm; min-height: 297mm; margin: 24px auto; background: #fff;
      padding: 16mm 18mm; box-shadow: 0 2px 20px rgba(0,0,0,0.12);
      font-size: 10.5pt; line-height: 1.42;
    }
    .sheet h1 { font-size: 20pt; margin: 0 0 2px; letter-spacing: -0.01em; }
    .sheet h1 + p { color: var(--muted); font-size: 9.5pt; margin: 0 0 8px; }
    .sheet h2 {
      font-size: 10pt; text-transform: uppercase; letter-spacing: 0.08em;
      margin: 12px 0 5px; padding-bottom: 3px; border-bottom: 1px solid var(--ink);
    }
    .sheet h3 { font-size: 10.5pt; margin: 8px 0 1px; }
    .sheet h4 { font-size: 10pt; margin: 6px 0 1px; color: var(--muted); font-weight: 600; }
    .sheet p { margin: 3px 0; }
    .sheet ul { margin: 3px 0; padding-left: 16px; }
    .sheet li { margin: 1.5px 0; }
    .sheet hr { border: none; border-top: 1px solid var(--line); margin: 8px 0; }
    .sheet a { color: inherit; }
    .sheet.letter { font-size: 11pt; line-height: 1.55; }
    .sheet.letter p { margin: 0 0 10px; }
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
    @page { size: A4; margin: 0; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { margin: 0; box-shadow: none; width: auto; min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <div><strong id="title">Export</strong> <span>· choose "Save as PDF" in the print dialog</span></div>
    <button id="print" type="button">Print / Save as PDF</button>
  </div>
  <article id="sheet" class="sheet"></article>
  <script type="module" src="export.js"></script>
</body>
</html>
